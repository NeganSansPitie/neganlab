name = "neganlab-planning-api"
main = "worker/planning-api-worker.mjs"
compatibility_date = "2026-05-16"
workers_dev = true

[[kv_namespaces]]
binding = "PLANNING_KV"
id = "YOUR_KV_NAMESPACE_ID"
