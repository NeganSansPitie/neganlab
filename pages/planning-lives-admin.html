<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion du planning</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      --bg: #080b14;
      --panel: #1a1a2f;
      --line: rgba(255,255,255,0.08);
      --text: #f4f7ff;
      --muted: #a6acc0;
      --cyan: #12e7ff;
      --pink: #fe2c55;
      --violet: #a970ff;
      --gold: #ffcc59;
      --shadow: 0 24px 70px rgba(0,0,0,0.35);
      --radius: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(169,112,255,0.10), transparent 20%),
        radial-gradient(circle at top right, rgba(18,231,255,0.08), transparent 18%),
        linear-gradient(180deg, #05070d 0%, #080b14 100%);
    }

    .page {
      max-width: 1520px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: linear-gradient(180deg, #18233a 0%, #162238 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
    }

    h1, h2 { margin-bottom: 12px; }
    p { color: var(--muted); line-height: 1.65; margin-bottom: 18px; }
    .hidden { display: none; }
    .form-grid { display: grid; gap: 14px; }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: white;
    }

    textarea { min-height: 110px; resize: vertical; }

    .checkbox-row,
    .actions,
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.92rem;
      color: white;
    }

    .chip.platform-youtube::before {
      content: "▶";
      color: #ff5b7f;
      font-size: 0.9rem;
    }

    .chip.platform-twitch::before {
      content: "◉";
      color: #b184ff;
      font-size: 0.85rem;
    }

    .chip input { width: auto; accent-color: var(--cyan); }

    .btn,
    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 16px;
      padding: 12px 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }

    .btn:hover,
    .file-label:hover { transform: translateY(-2px); opacity: 0.98; }

    .btn.primary {
      background: linear-gradient(135deg, var(--cyan), var(--pink));
      border: none;
      box-shadow: 0 12px 28px rgba(254,44,85,0.18);
    }

    .btn.secondary {
      background: linear-gradient(135deg, var(--violet), var(--cyan));
      border: none;
      box-shadow: 0 12px 28px rgba(99,179,255,0.16);
    }

    .file-input { display: none; }
    .planning-list { display: grid; gap: 18px; }

    .planning-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      overflow: hidden;
    }

    .planning-image {
      width: 100%;
      background: #101523;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .planning-image.vertical {
      min-height: 320px;
      max-height: 360px;
    }

    .planning-image.horizontal {
      min-height: 180px;
      max-height: 220px;
    }

    .planning-image img {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      border-radius: 18px;
      display: block;
    }

    .planning-body { padding: 18px; }
    .planning-body h3 { margin-bottom: 8px; }

    .notice {
      font-size: 0.92rem;
      color: var(--muted);
    }

    .notice.success { color: #b8ffe7; }
    .notice.error { color: #ffb2c1; }

    @media (max-width: 760px) {
      .page { padding: 10px; }
      .panel { padding: 18px 14px; }
      .planning-image.vertical { min-height: 280px; max-height: none; }
      .planning-image.horizontal { min-height: 180px; max-height: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div id="loginPanel" class="panel hidden">
      <h1>Connexion au planning</h1>
      <p>Quand l'API Cloudflare est active, connecte-toi ici pour gérer un planning partagé entre tous tes appareils.</p>
      <form class="form-grid" id="loginForm">
        <input id="adminEmail" type="email" placeholder="Email administrateur" required>
        <input id="adminPassword" type="password" placeholder="Mot de passe" required>
        <div class="actions">
          <button class="btn primary" type="submit">Se connecter</button>
          <a class="btn" href="../index.html">Retour au site</a>
        </div>
        <div class="notice" id="loginStatus"></div>
      </form>
    </div>

    <div id="adminPanel" class="panel hidden">
      <div class="actions" style="justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h1>Gestion du planning</h1>
        <button class="btn" id="logoutBtn" type="button">Déconnexion</button>
      </div>
      <p id="modeDescription">Chargement du mode de gestion...</p>

      <form class="form-grid" id="planningForm">
        <input id="planTitle" type="text" placeholder="Titre du planning ou du live" required>
        <textarea id="planDescription" placeholder="Description ou infos à afficher"></textarea>
        <input id="planStart" type="date" required>
        <input id="planEnd" type="date" placeholder="Date de fin optionnelle">
        <select id="planOrientation">
          <option value="horizontal">Image horizontale</option>
          <option value="vertical">Image verticale</option>
        </select>
        <div class="checkbox-row">
          <label class="chip platform-youtube"><input type="checkbox" id="platformYouTube"> YouTube</label>
          <label class="chip platform-twitch"><input type="checkbox" id="platformTwitch"> Twitch</label>
        </div>
        <label class="file-label" for="planImage">Choisir une image</label>
        <input class="file-input" id="planImage" type="file" accept="image/*">
        <div class="notice" id="imageStatus">Aucune image sélectionnée.</div>
        <div class="actions">
          <button class="btn primary" type="submit">Enregistrer le planning</button>
          <button class="btn secondary" type="button" id="clearAllBtn">Tout supprimer</button>
          <a class="btn" href="planning-lives.html">Voir la page publique</a>
        </div>
        <div class="notice" id="saveStatus"></div>
      </form>
    </div>

    <div class="panel">
      <h2>Événements enregistrés</h2>
      <div class="planning-list" id="planningList"></div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";
    const LOCAL_KEY = "negan_live_planning_entries_v3";

    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const loginForm = document.getElementById("loginForm");
    const adminEmail = document.getElementById("adminEmail");
    const adminPassword = document.getElementById("adminPassword");
    const logoutBtn = document.getElementById("logoutBtn");
    const planningForm = document.getElementById("planningForm");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const planningList = document.getElementById("planningList");
    const imageInput = document.getElementById("planImage");
    const imageStatus = document.getElementById("imageStatus");
    const saveStatus = document.getElementById("saveStatus");
    const loginStatus = document.getElementById("loginStatus");
    const modeDescription = document.getElementById("modeDescription");

    let mode = "local";
    let pendingImage = "";
    let apiEntries = [];

    function getLocalEntries() {
      return JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
    }

    function setLocalEntries(entries) {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(entries));
    }

    function sortEntries(entries) {
      return [...entries].sort((a, b) => String(a.startDate).localeCompare(String(b.startDate)));
    }

    function formatDateRange(startDate, endDate) {
      if (!endDate || startDate === endDate) return startDate;
      return `${startDate} au ${endDate}`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function setNotice(node, message, tone = "") {
      node.textContent = message;
      node.className = tone ? `notice ${tone}` : "notice";
    }

    function renderEntries(entries) {
      const sorted = sortEntries(entries);

      if (!sorted.length) {
        planningList.innerHTML = `<div class="notice">Aucun événement enregistré pour le moment.</div>`;
        return;
      }

      planningList.innerHTML = sorted.map((entry, index) => `
        <article class="planning-card">
          <div class="planning-image ${entry.orientation === "vertical" ? "vertical" : "horizontal"}">
            ${entry.image ? `<img src="${entry.image}" alt="${escapeHtml(entry.title)}">` : ""}
          </div>
          <div class="planning-body">
            <h3>${escapeHtml(entry.title)}</h3>
            <p>${escapeHtml(entry.description || "Événement Negan Lab.")}</p>
            <div class="chips">
              <span class="chip">${escapeHtml(formatDateRange(entry.startDate, entry.endDate))}</span>
              ${entry.platforms.includes("youtube") ? `<span class="chip">YouTube</span>` : ""}
              ${entry.platforms.includes("twitch") ? `<span class="chip">Twitch</span>` : ""}
            </div>
            <div class="actions" style="margin-top:14px;">
              <button class="btn" type="button" onclick="removeEntry(${index}, '${escapeHtml(entry.id || "")}')">Supprimer</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        credentials: "include",
        headers: {
          "Content-Type": "application/json"
        },
        ...options
      });
      const text = await response.text();
      let payload = null;
      try { payload = text ? JSON.parse(text) : null; } catch { payload = null; }
      return { response, payload };
    }

    async function detectMode() {
      try {
        const { response } = await apiRequest("/planning", { method: "GET" });
        if (response.ok) {
          mode = "api";
          loginPanel.classList.remove("hidden");
          adminPanel.classList.add("hidden");
          modeDescription.textContent = "Mode Cloudflare actif : connecte-toi pour gérer un planning partagé entre tes appareils.";
          renderEntries([]);
          return;
        }
      } catch {}

      mode = "local";
      loginPanel.classList.add("hidden");
      adminPanel.classList.remove("hidden");
      logoutBtn.classList.add("hidden");
      modeDescription.textContent = "Mode local navigateur : pratique pour tester, mais non partagé entre appareils tant que l'API Cloudflare n'est pas branchée.";
      renderEntries(getLocalEntries());
    }

    async function loadAdminEntries() {
      if (mode !== "api") {
        renderEntries(getLocalEntries());
        return;
      }

      const { response, payload } = await apiRequest("/admin/planning", { method: "GET" });
      if (response.status === 401 || response.status === 403) {
        adminPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
        setNotice(loginStatus, "Connexion requise pour accéder au planning partagé.", "error");
        return;
      }

      apiEntries = Array.isArray(payload?.entries) ? payload.entries : [];
      adminPanel.classList.remove("hidden");
      loginPanel.classList.add("hidden");
      renderEntries(apiEntries);
      modeDescription.textContent = "Mode Cloudflare actif : chaque changement est partagé sur tous tes appareils et pour les visiteurs.";
    }

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (!file) {
        pendingImage = "";
        imageStatus.textContent = "Aucune image sélectionnée.";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = reader.result;
        imageStatus.textContent = `${file.name} prête à être enregistrée.`;
      };
      reader.readAsDataURL(file);
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setNotice(loginStatus, "Connexion en cours...");

      const { response, payload } = await apiRequest("/admin/login", {
        method: "POST",
        body: JSON.stringify({
          email: adminEmail.value.trim(),
          password: adminPassword.value
        })
      });

      if (!response.ok) {
        setNotice(loginStatus, payload?.error || "Connexion refusée.", "error");
        return;
      }

      loginForm.reset();
      setNotice(loginStatus, "Connexion réussie.", "success");
      await loadAdminEntries();
    });

    logoutBtn.addEventListener("click", async () => {
      if (mode === "api") {
        await apiRequest("/admin/logout", { method: "POST" });
        adminPanel.classList.add("hidden");
        loginPanel.classList.remove("hidden");
        setNotice(loginStatus, "Déconnecté.");
      }
    });

    planningForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const platforms = [];
      if (document.getElementById("platformYouTube").checked) platforms.push("youtube");
      if (document.getElementById("platformTwitch").checked) platforms.push("twitch");

      if (!platforms.length) {
        setNotice(saveStatus, "Choisis au moins une plateforme.", "error");
        return;
      }

      if (!pendingImage) {
        setNotice(saveStatus, "Ajoute une image pour le planning.", "error");
        return;
      }

      const entry = {
        title: document.getElementById("planTitle").value.trim(),
        description: document.getElementById("planDescription").value.trim(),
        startDate: document.getElementById("planStart").value,
        endDate: document.getElementById("planEnd").value,
        orientation: document.getElementById("planOrientation").value,
        platforms,
        image: pendingImage
      };

      if (mode === "api") {
        const { response, payload } = await apiRequest("/admin/planning", {
          method: "POST",
          body: JSON.stringify(entry)
        });

        if (!response.ok) {
          setNotice(saveStatus, payload?.error || "Enregistrement impossible.", "error");
          return;
        }

        apiEntries = Array.isArray(payload?.entries) ? payload.entries : [];
        renderEntries(apiEntries);
        setNotice(saveStatus, "Planning enregistré sur Cloudflare.", "success");
      } else {
        const entries = getLocalEntries();
        entries.push({ ...entry, id: crypto.randomUUID() });
        setLocalEntries(entries);
        renderEntries(entries);
        setNotice(saveStatus, "Planning enregistré localement dans ce navigateur.", "success");
      }

      planningForm.reset();
      pendingImage = "";
      imageStatus.textContent = "Aucune image sélectionnée.";
    });

    clearAllBtn.addEventListener("click", async () => {
      const confirmed = window.confirm("Supprimer tous les événements ?");
      if (!confirmed) return;

      if (mode === "api") {
        const { response, payload } = await apiRequest("/admin/planning?all=1", { method: "DELETE" });
        if (!response.ok) {
          setNotice(saveStatus, payload?.error || "Suppression impossible.", "error");
          return;
        }
        apiEntries = [];
      } else {
        localStorage.removeItem(LOCAL_KEY);
      }

      planningForm.reset();
      pendingImage = "";
      imageStatus.textContent = "Aucune image sélectionnée.";
      renderEntries([]);
      setNotice(saveStatus, mode === "api" ? "Planning Cloudflare vidé." : "Planning local vidé.", "success");
    });

    async function removeEntry(index, id) {
      if (mode === "api") {
        const { response, payload } = await apiRequest(`/admin/planning?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        if (!response.ok) {
          setNotice(saveStatus, payload?.error || "Suppression impossible.", "error");
          return;
        }
        apiEntries = Array.isArray(payload?.entries) ? payload.entries : [];
        renderEntries(apiEntries);
        setNotice(saveStatus, "Événement supprimé de Cloudflare.", "success");
        return;
      }

      const entries = getLocalEntries();
      entries.splice(index, 1);
      setLocalEntries(entries);
      renderEntries(entries);
      setNotice(saveStatus, "Événement supprimé localement.", "success");
    }

    window.removeEntry = removeEntry;

    detectMode();
  </script>
</body>
</html>
