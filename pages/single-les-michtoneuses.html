<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Michtoneuses - NEGAN & COZY</title>
  <meta name="description" content="Écoute directe du single Les Michtoneuses dans l'univers NEGAN & COZY." />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --panel: rgba(14,13,12,0.90); --line: rgba(255,255,255,0.12); --text: #f7f8ff; --muted: #b7b0a3; --gold: #d6a83f; --amber: #ffbf45; --shadow: 0 24px 70px rgba(0,0,0,0.36); --radius: 24px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; color: var(--text); font-family: Arial, sans-serif; background: radial-gradient(circle at 20% 10%, rgba(214,168,63,0.20), transparent 25%), linear-gradient(180deg, #050403 0%, #11100d 58%, #060504 100%); }
    .page { max-width: 1280px; margin: 0 auto; padding: 10px 18px 34px; }
    .hero, .single-shell { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .hero { overflow: hidden; margin-bottom: 24px; }
    .hero-banner { width: 100%; height: 280px; object-fit: cover; display: block; }
    .hero-body { display: flex; justify-content: space-between; gap: 24px; padding: 28px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--amber); font-weight: 800; text-decoration: none; }
    .hero-title { font-size: clamp(2rem, 6vw, 4rem); line-height: 0.95; margin-bottom: 12px; text-transform: uppercase; }
    .hero-title span { color: var(--amber); }
    .hero-text { color: var(--muted); line-height: 1.6; max-width: 620px; }
    .single-shell { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px; }
    .cover-shell { display: flex; align-items: center; justify-content: center; padding: 18px; border-radius: 22px; background: radial-gradient(circle at center, rgba(214,168,63,0.16), transparent 34%), #080706; }
    .cover-shell img { width: 100%; max-height: 560px; object-fit: contain; border-radius: 18px; display: block; }
    .single-content h2 { font-size: 2rem; margin-bottom: 12px; }
    .single-content p { color: var(--muted); line-height: 1.7; margin-bottom: 18px; }
    .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .pill { padding: 9px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); }
    .player-box { border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 14px; background: rgba(255,255,255,0.04); }
    .player-label { color: rgba(255,255,255,0.74); margin-bottom: 10px; font-size: 0.92rem; }
    audio { width: 100%; }
    @media (max-width: 900px) { .hero-body { flex-direction: column; } .single-shell { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .page { padding: 8px 10px 24px; } .hero-banner { height: 190px; } .hero-body, .single-shell { padding: 18px; } .single-content h2 { font-size: 1.55rem; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="hero-banner" src="../assets/images/negan-cozy-banner.png" alt="Bannière NEGAN & COZY">
      <div class="hero-body">
        <a class="back-link" href="musique-negan-cozy.html"><i class="fa-solid fa-house"></i> Musique</a>
        <div>
          <h1 class="hero-title">Single <span>NEGAN & COZY</span></h1>
          <p class="hero-text">Écoute le single directement sur le site, sans redirection externe.</p>
        </div>
      </div>
    </section>

    <section class="single-shell">
      <div class="cover-shell">
        <img src="../assets/images/Les michtoneuses.jpeg" alt="Les Michtoneuses">
      </div>
      <div class="single-content">
        <h2>Les Michtoneuses</h2>
        <p>Single sorti le 9 mai 2026, intégré à la collection musicale NEGAN & COZY.</p>
        <div class="meta">
          <span class="pill">Single</span>
          <span class="pill">9 mai 2026</span>
          <span class="pill" id="singleCounter">0 lecture</span>
        </div>
        <div class="player-box">
          <div class="player-label">Lecture directe sur le site</div>
          <audio id="singlePlayer" controls preload="none">
            <source src="https://cdn1.suno.ai/90eefc75-53c6-4385-9bf5-3b77f9de1d13.mp3" type="audio/mpeg">
          </audio>
        </div>
      </div>
    </section>
  </main>

  <script>
    const COUNTER_KEY = "negan_single_lesmichtoneuses_total_plays";
    const player = document.getElementById("singlePlayer");
    const counter = document.getElementById("singleCounter");
    let countedForCurrentPlay = false;
    function pluralize(value) { return value > 1 ? "lectures" : "lecture"; }
    function getCount() { return Number(localStorage.getItem(COUNTER_KEY) || 0); }
    function updateCounter() { const value = getCount(); counter.textContent = `${value} ${pluralize(value)}`; }
    player.addEventListener("play", () => {
      if (countedForCurrentPlay) return;
      localStorage.setItem(COUNTER_KEY, String(getCount() + 1));
      countedForCurrentPlay = true;
      updateCounter();
    });
    player.addEventListener("ended", () => { countedForCurrentPlay = false; });
    player.addEventListener("pause", () => { if (player.currentTime === 0) countedForCurrentPlay = false; });
    updateCounter();
  </script>
</body>
</html>
