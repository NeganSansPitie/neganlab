<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><link rel="manifest" href="contrat-manifest.json"><title>Contrat — Negan & Lucille</title>
<style>
:root{--bg:#090909;--card:#171717;--line:#333;--red:#b51f28;--gold:#d7b75a;--text:#f5f5f5;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:20px 15px 30px}.screen{display:none}.active{display:block}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}.hero{text-align:center;background:linear-gradient(145deg,#231010,#121212)}h1{font-size:32px;line-height:1.05}h2{font-size:24px}.muted{color:var(--muted)}button{width:100%;min-height:48px;border-radius:13px;border:1px solid #444;background:#222;color:#fff;font-weight:800;padding:10px;margin-top:8px}.primary{background:var(--red);border-color:#df4a52}.gold{background:#292310;border-color:var(--gold);color:#efd476}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{text-align:left}.nav{display:flex;gap:8px}.nav button{flex:1}li{line-height:1.55;margin:8px 0}.callout{border-left:3px solid var(--gold);padding:12px;background:#211d12;border-radius:8px}label{display:block;margin:12px 0}.check{display:flex;gap:9px}.sig{width:100%;height:220px;background:#fff;border-radius:12px;touch-action:none}.tools{display:flex;gap:8px}.tools button{width:auto}.ok{color:#8be28b}.err{color:#ff9c9c}@media(max-width:430px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main class="app" id="app"><div class="muted" id="count"></div>
<section class="screen active"><div class="hero"><div style="font-size:48px">🔒</div><h1>CONTRAT<br>NEGAN & LUCILLE</h1><p>Cadre commun fondé sur le respect, la communication et le consentement.</p></div><button class="primary" data-go="1">Commencer</button></section>
<section class="screen"><div class="hero"><h2>Sommaire</h2><p class="muted">Choisis un article ou avance page par page.</p></div><div class="grid" id="menu"></div><button class="gold" data-go="14">Aller aux signatures</button></section>
<div id="articles"></div>
<section class="screen"><div class="hero"><h2>Engagements & signatures</h2><p>Chaque partenaire confirme avoir lu et accepté le cadre convenu.</p></div><div class="card"><label class="check"><input id="agree" type="checkbox"><span>Nous confirmons notre accord libre et volontaire.</span></label></div>
<div class="card"><b>MAÎTRE — NEGAN</b><canvas class="sig" id="s1" width="1000" height="440"></canvas><button class="gold" data-clear="s1">Effacer</button></div>
<div class="card"><b>SOUMISE — LUCILLE</b><canvas class="sig" id="s2" width="1000" height="440"></canvas><button class="gold" data-clear="s2">Effacer</button></div>
<button class="primary" id="validate">Valider les signatures</button><p id="msg" class="muted"></p></section>
<div class="nav"><button id="prev">← Retour</button><button class="primary" id="next">Suivant →</button></div></main>
<script>
const data=[
["Article 1 — Engagement",["Le présent document définit un cadre commun entre les deux partenaires.","Le cadre repose sur confiance, respect, communication et consentement.","Les rôles sont librement acceptés.","Les règles applicables sont connues avant la séance."],"La confiance reste la base."],
["Article 2 — Règles",["Respecter les règles acceptées.","Respecter les consignes convenues.","Participer volontairement.","Signaler tout malaise ou besoin d'arrêt.","Respecter les limites définies.","Préserver respect et complicité."],"La participation reste volontaire."],
["Article 3 — Responsabilités",["Respecter les limites et accords.","Rester attentif au bien-être de chacun.","Utiliser uniquement ce qui a été accepté.","Adapter ou arrêter si nécessaire.","Respecter les mots de sécurité.","La responsabilité accompagne le rôle."],"Le respect des limites est prioritaire."],
["Article 4 — Sécurité",["ROUGE : arrêt immédiat.","JAUNE : ralentir et vérifier.","VERT : tout va bien.","Toute demande claire d'arrêt est prioritaire."],"ROUGE prime sur toute autre règle."],
["Article 5 — Limites",["Les limites sont définies avant chaque séance.","Elles sont connues des deux partenaires.","Elles constituent le cadre convenu.","Aucune nouvelle pratique importante n'est imposée unilatéralement.","Les modifications importantes sont discutées.","Le retrait du consentement reste prioritaire."],"Le cadre est défini ensemble."],
["Article 6 — Conséquences",["Les conséquences restent dans les limites convenues.","Elles sont prévues à l'avance.","Elles peuvent être ludiques ou symboliques.","Aucune conséquence ne peut contredire le consentement.","ROUGE reste prioritaire."],"Aucune règle ne passe au-dessus du consentement."],
["Article 7 — Consentement",["Le consentement doit être libre, clair et volontaire.","Une pause peut être demandée.","ROUGE signifie arrêt immédiat.","Un accord ancien ne vaut pas automatiquement pour une nouvelle situation.","La reprise nécessite l'accord des deux partenaires."],"Consentement + communication + confiance."],
["Article 8 — Après séance",["Un échange est prévu après la séance.","Chacun peut dire ce qui a été apprécié ou non.","Un inconfort peut être exprimé sans jugement.","Les séances suivantes peuvent être adaptées.","Le respect reste présent après le jeu."],"Retour à l'écoute et à la complicité."],
["Article 9 — Durée",["La durée de chaque séance est définie librement.","Une séance peut être interrompue.","Les accords spécifiques sont discutés avant une nouvelle séance.","Le règlement peut être actualisé d'un commun accord."],"Chaque séance commence avec un cadre clair."],
["Article 10 — Référence",["Les règles acceptées servent de référence commune.","Les règles fondamentales ne sont pas modifiées unilatéralement.","Les changements importants sont acceptés par les deux partenaires.","Le consentement et ROUGE restent prioritaires.","La version signée constitue la référence."],"Les règles forment un cadre commun."],
["Article 11 — Initiative au réveil",["Une initiative au réveil peut être prévue dans le cadre convenu.","Elle peut être spontanée lorsque cette règle a été acceptée.","Elle reste volontaire.","Elle ne force pas la poursuite du jeu dans toutes les circonstances.","Les limites et le consentement restent applicables."],"Une initiative prévue reste soumise au cadre convenu."],
["Pratiques & accessoires",["Les pratiques et accessoires sont définis à l'avance.","Seuls les éléments expressément acceptés sont utilisés.","Tout nouvel élément doit être accepté avant la séance.","Les préférences et exclusions sont définies ensemble.","Aucun accessoire ne remplace le consentement."],"Les détails sont définis ensemble."],
["Limites & préférences",["Limites absolues : à définir ensemble.","Limites de séance : à définir avant le jeu.","Préférences : à définir ensemble.","Éléments autorisés : à définir ensemble.","Communication : JAUNE / ROUGE.","Consentement prioritaire en toutes circonstances."],"Cette page sert de référence avant chaque séance."]
];
const all=[...document.querySelectorAll(".screen")];let current=0;const total=all.length;
const menu=document.getElementById("menu"),holder=document.getElementById("articles");
data.forEach((a,i)=>{let b=document.createElement("button");b.textContent=a[0];b.dataset.go=i+2;menu.appendChild(b);let s=document.createElement("section");s.className="screen";s.innerHTML='<div class="hero"><h2>'+a[0]+'</h2></div><div class="card"><ul>'+a[1].map(x=>'<li>'+x+'</li>').join("")+'</ul><div class="callout">'+a[2]+'</div></div>';holder.appendChild(s)});
const screens=[...document.querySelectorAll(".screen")];
function show(n){current=Math.max(0,Math.min(screens.length-1,n));screens.forEach((s,i)=>s.classList.toggle("active",i===current));document.getElementById("count").textContent=current===0?"Accueil":current===1?"Sommaire":current===screens.length-1?"Signature":"Article "+(current-1)+" / "+data.length;document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current===screens.length-1;document.getElementById("next").textContent=current===screens.length-2?"Signer →":"Suivant →";window.scrollTo(0,0)}
document.getElementById("app").addEventListener("click",e=>{let g=e.target.closest("[data-go]");if(g)show(+g.dataset.go);let c=e.target.closest("[data-clear]");if(c)clearSig(c.dataset.clear)});
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);
function makeSig(id){let c=document.getElementById(id),x=c.getContext("2d"),down=false,has=false;x.lineWidth=5;x.lineCap="round";x.strokeStyle="#111";function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{down=true;has=true;let q=p(e);x.beginPath();x.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!down)return;let q=p(e);x.lineTo(q.x,q.y);x.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;c._has=()=>has;c._clear=()=>{x.clearRect(0,0,c.width,c.height);has=false}}
function clearSig(id){document.getElementById(id)._clear()}makeSig("s1");makeSig("s2");
validate.onclick=()=>{let ok=agree.checked&&s1._has()&&s2._has();msg.textContent=ok?"✓ Les deux signatures sont présentes.":"Coche la confirmation et ajoute les deux signatures.";msg.className=ok?"ok":"err"};
if("serviceWorker"in navigator)navigator.serviceWorker.register("contrat-sw.js").catch(()=>{});show(0);
</script></body></html>
