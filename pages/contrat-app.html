<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<link rel="manifest" href="contrat-manifest.json">
<title>Contrat des règles du Maître — Negan & Lucille</title>
<style>
:root{--bg:#080808;--panel:#151515;--panel2:#101010;--line:#353535;--red:#a91e27;--gold:#d8b75d;--text:#f7f7f7;--muted:#aaa}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.65}
.app{max-width:820px;margin:auto;padding:18px 16px 120px}
.page{display:none;min-height:calc(100vh - 155px)}
.page.active{display:block}
.cover{min-height:calc(100vh - 190px);display:flex;align-items:center;justify-content:center}
.hero{width:100%;background:linear-gradient(150deg,#281012,#111);border:1px solid #4a2528;border-radius:24px;padding:32px 24px;text-align:center;box-shadow:0 18px 50px #0008}
.badge{display:inline-block;color:var(--gold);font-size:14px;font-weight:800;letter-spacing:2px;margin-bottom:14px}
.cover-art{display:block;width:min(220px,65vw);height:auto;margin:0 auto 18px;filter:drop-shadow(0 10px 24px #0009)}
.start{width:100%;margin-top:18px;background:var(--red);border-color:#d24a51;min-height:60px;font-size:18px}
h1{font-size:clamp(32px,8vw,54px);line-height:1.05;margin:10px 0 20px}
h2{font-size:clamp(25px,6vw,36px);line-height:1.15;margin:0 0 22px}
h3{font-size:21px;color:var(--gold);margin:0 0 15px}
.intro{font-size:18px}
.identities{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}
.identity{background:#0c0c0c;border:1px solid #3d3d3d;border-radius:15px;padding:18px}
.identity b{display:block;color:var(--gold);font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.identity span{font-size:23px;font-weight:800}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}
.article-text p,.article-text li{font-size:18px;line-height:1.72}
.article-text li{margin:13px 0;padding-left:4px}
.article-text ol{padding-left:28px}
.security{border-left:4px solid var(--gold);background:#211c0e}
.footer-nav{position:fixed;left:0;right:0;bottom:0;background:#0b0b0bf2;border-top:1px solid #333;backdrop-filter:blur(12px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10}
.footer-inner{max-width:820px;margin:auto;display:flex;gap:10px}
button{border:1px solid #444;background:#242424;color:#fff;border-radius:13px;min-height:54px;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer}
.next{background:var(--red);border-color:#d24a51;flex:1}
.back{min-width:120px}
button:disabled{opacity:.35}
.progress{font-size:13px;color:#888;text-align:center;margin:0 0 10px}
.field{width:100%;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:12px;padding:13px;font:inherit;margin:8px 0 18px}
.check{display:flex;gap:12px;margin:13px 0;align-items:flex-start}
.check input{margin-top:7px;accent-color:var(--red);width:18px;height:18px}
.signature{width:100%;height:240px;background:#fff;border-radius:14px;touch-action:none;border:1px solid #888}
.small{font-size:15px;color:var(--muted)}
.ok{color:#8be28b;font-weight:800}.err{color:#ff9b9b;font-weight:800}
@media(max-width:600px){body{font-size:17px}.app{padding:12px 12px 120px}.hero{padding:27px 18px}.identities{grid-template-columns:1fr}.card{padding:20px}.article-text p,.article-text li{font-size:17px;line-height:1.68}.footer-inner{gap:8px}.back{min-width:90px}}
</style>
</head>
<body>
<main class="app">
<div id="pages"></div>
</main>
<div class="footer-nav"><div class="footer-inner">
<button class="back" id="back">← Retour</button><button class="next" id="next">Suivant →</button>
</div></div>

<script>
const P=[];

P.push(`
<section class="page active cover">
<div class="hero">
<img class="cover-art" src="contrat-lock.svg" alt="Cadenas — Confiance • Consentement">
<div class="badge">◆ CONTRAT DES RÈGLES DU MAÎTRE ◆</div>
<h1>CONTRAT DES RÈGLES DU MAÎTRE</h1>
<p>Entre <b>Negan</b>, le Maître, et <b>Lucille</b>, la Soumise</p>
<div class="badge">CONFIANCE • DOMINATION • CONSENTEMENT • RESPECT</div>
<div class="identities">
<div class="identity"><b>Le Maître</b><span>Negan</span></div>
<div class="identity"><b>La Soumise</b><span>Lucille</span></div>
</div>
<p class="intro">Ce contrat définit les règles de notre jeu BDSM et les engagements que nous choisissons librement d’accepter. Il s’agit d’un jeu basé sur la confiance, le respect, la communication et le consentement mutuel.</p>
<button class="start" onclick="startContract()">DÉMARRER LE CONTRAT →</button>
</div>
</section>`);

function article(title,body){P.push(`<section class="page"><div class="card"><div class="badge">CONTRAT DES RÈGLES DU MAÎTRE</div><h2>${title}</h2><div class="article-text">${body}</div></div></section>`)}
article("ARTICLE 1 — L’ENGAGEMENT",`
<p>La Soumise reconnaît entrer volontairement dans ce jeu avec le Maître.</p>
<p>Le Maître s’engage à respecter la personne, les limites et le bien-être de sa Soumise.</p>
<p>La relation de domination n’existe que dans le cadre du jeu et ne donne aucun droit réel de contrôle sur la vie, les choix ou les décisions personnelles de la Soumise.</p>`);
article("ARTICLE 2 — LES RÈGLES DE LA SOUMISE",`
<ol>
<li>Respecter les consignes du Maître.</li><li>Répondre honnêtement aux questions du Maître.</li>
<li>Prévenir immédiatement le Maître lorsqu’une règle ou une situation devient inconfortable.</li>
<li>Respecter les horaires et rendez-vous convenus.</li><li>Conserver une attitude respectueuse envers le Maître.</li>
<li>Ne pas volontairement provoquer ou tester les limites établies sans accord préalable.</li>
<li>Accepter les conséquences prévues dans le cadre du jeu lorsqu’une règle est volontairement enfreinte.</li>
<li>Communiquer ses limites avant ou pendant le jeu lorsque cela est nécessaire.</li>
</ol>`);
article("ARTICLE 3 — LES OBLIGATIONS DU MAÎTRE",`
<ol>
<li>Respecter les limites clairement exprimées par la Soumise.</li>
<li>Ne jamais utiliser le jeu pour imposer une situation non consentie.</li>
<li>Rester attentif au bien-être physique et psychologique de sa Soumise.</li>
<li>Respecter immédiatement un signal d’arrêt.</li>
<li>Ne pas utiliser les informations personnelles ou intimes de la Soumise contre elle en dehors du jeu.</li>
<li>Maintenir une relation basée sur la confiance et le respect.</li>
<li>Accepter qu’une règle puisse être discutée ou modifiée d’un commun accord.</li>
</ol>`);
article("ARTICLE 4 — LE MOT DE SÉCURITÉ",`
<div class="card security"><p><b>VERT :</b> tout va bien, le jeu peut continuer.</p><p><b>JAUNE :</b> ralentissement ou vérification nécessaire. Le Maître doit vérifier la situation.</p><p><b>ROUGE :</b> arrêt immédiat du jeu.</p><p>Le mot <b>ROUGE</b> met immédiatement fin à toute action en cours.</p></div>`);
article("ARTICLE 5 — LES LIMITES",`
<p>Avant le début du jeu, le Maître et la Soumise doivent définir clairement les limites applicables à la séance.</p>
<p>Les limites ainsi définies doivent être connues et acceptées par les deux partenaires avant le commencement du jeu.</p>
<p>Une fois la séance commencée et les limites établies, celles-ci constituent le cadre de la séance et ne peuvent pas être modifiées ou annulées en cours de jeu.</p>
<p>Les limites doivent donc être définies avec soin avant le début de chaque séance.</p>`);
article("ARTICLE 6 — LES CONSÉQUENCES",`
<p>En cas de non-respect volontaire d’une règle, le Maître peut appliquer une conséquence ou une punition prévue dans le cadre du jeu, conformément aux conséquences préalablement acceptées.</p>
<p>Les conséquences doivent rester adaptées au jeu et ne jamais avoir pour objectif de blesser, humilier réellement ou mettre en danger la Soumise.</p>`);
article("ARTICLE 7 — LE RESPECT DU CONSENTEMENT",`
<p>Le consentement peut être retiré à tout moment.</p>
<p>Aucune règle de ce contrat ne peut empêcher Lucille de dire <b>STOP</b>.</p>
<p>Un consentement donné précédemment ne signifie pas automatiquement un consentement pour une nouvelle situation.</p>
<p>Le mot de sécurité et le retrait du consentement restent prioritaires sur toutes les autres règles.</p>`);
article("ARTICLE 8 — APRÈS LE JEU",`
<p>Après une séance, le Maître et la Soumise prennent le temps de communiquer.</p>
<p>Ils peuvent notamment discuter de ce qui a été apprécié, de ce qui a été moins apprécié, des éventuelles limites rencontrées et des ajustements nécessaires pour une prochaine séance.</p>`);
article("ARTICLE 9 — DURÉE",`
<p>Ce contrat prend effet à partir du : <b>____ / ____ / ______</b></p>
<p>Il reste valable uniquement dans le cadre du jeu BDSM convenu entre les deux partenaires.</p>
<p>Il peut être suspendu ou annulé à tout moment par l’un ou l’autre.</p>`);
article("ARTICLE 10 — CARACTÈRE DÉFINITIF DU RÈGLEMENT",`
<p>Une fois les règles de base établies, lues et acceptées par la Soumise, celles-ci constituent le règlement de référence du jeu entre le Maître et la Soumise.</p>
<p>La Soumise reconnaît avoir pris connaissance de l’ensemble des règles avant de les accepter.</p>
<p>Une fois le règlement accepté, aucune modification ne pourra être imposée unilatéralement par le Maître. Toute nouvelle règle ou modification devra être clairement présentée et acceptée par les deux partenaires avant de faire partie du règlement.</p>
<p>La Soumise s’engage à respecter les règles qu’elle a acceptées pendant les périodes de jeu prévues.</p>
<p>Le mot de sécurité ROUGE et le retrait du consentement restent prioritaires sur toute autre règle.</p>`);
article("ARTICLE 11 — RÈGLE DU RÉVEIL DU MAÎTRE",`
<p>Lorsque le Maître est profondément endormi, la Soumise est autorisée, dans le cadre préalablement convenu entre eux, à prendre elle-même l’initiative de le réveiller de manière sensuelle, entreprenante et suggestive.</p>
<p>La Soumise ne doit pas attendre que le Maître lui demande de venir le réveiller : lorsqu’elle choisit d’appliquer cette règle, elle prend spontanément l’initiative et vient réveiller le Maître en adoptant une attitude volontaire et entreprenante afin d’initier le moment intime convenu entre eux.</p>
<p>Le Maître s’engage à accueillir favorablement cette initiative de la Soumise et à ne pas la rejeter simplement par principe lorsqu’elle applique une règle préalablement acceptée.</p>
<p>Cette règle ne constitue toutefois pas une obligation pour le Maître de poursuivre le jeu dans toutes les circonstances : les limites, le consentement et le mot de sécurité définis dans le présent règlement restent applicables.</p>`);

P.push(`
<section class="page">
<div class="card"><div class="badge">FICHE DES LIMITES ET PRÉFÉRENCES</div><h2>FICHE DES LIMITES ET PRÉFÉRENCES</h2>
<h3>Limites absolues de Lucille :</h3><textarea class="field" rows="4"></textarea>
<h3>Limites applicables à la séance :</h3><textarea class="field" rows="4"></textarea>
<h3>Points à discuter avant le début du jeu :</h3><textarea class="field" rows="4"></textarea>
<h3>CONSÉQUENCES AUTORISÉES</h3>
<label class="check"><input type="checkbox">Privation temporaire d’un privilège de jeu</label>
<label class="check"><input type="checkbox">Défi ou tâche supplémentaire</label>
<label class="check"><input type="checkbox">Punition symbolique</label>
<label>Autre :<input class="field"></label>
</div>
</section>`);

P.push(`
<section class="page">
<div class="card"><div class="badge">RÈGLE SUPPLÉMENTAIRE DU MAÎTRE</div><h2>RÈGLE SUPPLÉMENTAIRE DU MAÎTRE</h2>
<p>Une règle peut être ajoutée uniquement si les deux partenaires l’ont comprise et acceptée.</p>
<p>Règle n° ____ :</p><textarea class="field" rows="7"></textarea>
<p>Acceptée par : ☐ Negan &nbsp;&nbsp; ☐ Lucille</p>
<p>Date : ____ / ____ / ______</p>
</div>
</section>`);

const root=document.getElementById('pages');root.innerHTML=P.join('');
let current=0;
const all=[...document.querySelectorAll('.page')];
const back=document.getElementById('back'),next=document.getElementById('next');
function render(){all.forEach((p,i)=>p.classList.toggle('active',i===current));back.disabled=current===0;next.textContent=current===all.length-1?'Terminer ✓':'Suivant →';document.querySelector('.footer-nav').style.display=current===0?'none':'block';window.scrollTo({top:0,behavior:'smooth'});}
function startContract(){current=1;render();}
back.onclick=()=>{if(current>0){current--;render();}};
next.onclick=()=>{if(current<all.length-1){current++;render();}else{alert('Le dossier est terminé.');}};
function setupSig(id){const c=document.getElementById(id),ctx=c.getContext('2d');let draw=false;ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#111';c.addEventListener('pointerdown',e=>{draw=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height)});c.addEventListener('pointermove',e=>{if(!draw)return;const r=c.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()});c.addEventListener('pointerup',()=>draw=false);c.addEventListener('pointercancel',()=>draw=false);}
function clearSig(id){const c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height);}
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('contrat-sw.js').catch(()=>{});
</script>
</body>
</html>
