<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soutenir Negan Lab</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <script src="https://www.paypal.com/sdk/js?client-id=AR_O9ls48jsRxBPKM9OVlE1o8i6QcVD2hutVxTUjh3TAzOlPxxuHHaOnt8JwvqUftd8L-tKV86pgME2Z&currency=EUR&intent=capture&components=buttons&disable-funding=card,credit,paylater,bancontact,sepa"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: black;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1a2e, #050510);
      color: white;
      padding: 20px;
    }

    #intro {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    #intro h1 {
      font-size: 28px;
      text-align: center;
      color: #c77dff;
      opacity: 0;
      animation: introAnim 2.8s ease forwards;
    }

    @keyframes introAnim {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #c77dff, #00f5ff, #ff4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: #0a0a1a;
      color: white;
      box-shadow: 0 0 10px rgba(199,125,255,0.3);
    }

    input:focus {
      box-shadow: 0 0 15px #c77dff;
    }

    .hint {
      color: rgba(255,255,255,0.72);
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 12px;
      text-align: center;
    }

    .paypal-error {
      display: none;
      margin-top: 12px;
      color: #ff6b6b;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }

    #paypal-button-container {
      margin-top: 15px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-bottom: 15px;
      color: #00f5ff;
      text-decoration: none;
    }

    .card {
      background: rgba(10,10,26,0.8);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(199,125,255,0.2);
    }
  </style>
</head>
<body>
  <div id="intro">
    <h1>Merci pour ton soutien</h1>
  </div>

  <div class="app">
    <a href="../index.html" class="back"><i class="fa-solid fa-house"></i> Accueil</a>

    <div class="card">
      <h2>Soutenir Negan Lab</h2>
      <p class="hint">Choisis ton montant, puis connecte-toi a PayPal pour valider le don.</p>

      <input id="amount" type="number" value="1.00" min="1.00" step="0.50" placeholder="Montant EUR">
      <input id="name" type="text" placeholder="Ton pseudo">
      <input id="message" type="text" placeholder="Message">

      <div id="paypal-button-container"></div>
      <p id="paypal-error" class="paypal-error"></p>
    </div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("intro").style.opacity = "0";
      document.getElementById("intro").style.transition = "0.6s";

      setTimeout(() => {
        document.getElementById("intro").style.display = "none";
      }, 600);
    }, 3200);

    const amountInput = document.getElementById("amount");
    const errorMessage = document.getElementById("paypal-error");

    function showPaypalError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    function getDonationAmount() {
      const amount = Number(amountInput.value.replace(",", "."));

      if (!Number.isFinite(amount) || amount < 1) {
        showPaypalError("Entre un montant valide de minimum 1 EUR.");
        return null;
      }

      errorMessage.style.display = "none";
      return amount.toFixed(2);
    }

    paypal.Buttons({
      fundingSource: paypal.FUNDING.PAYPAL,

      onClick: function(data, actions) {
        return getDonationAmount() ? actions.resolve() : actions.reject();
      },

      createOrder: function(data, actions) {
        const amount = getDonationAmount();

        return actions.order.create({
          purchase_units: [{
            amount: { value: amount }
          }]
        });
      },

      onApprove: function(data, actions) {
        return actions.order.capture().then(function() {
          const name = document.getElementById("name").value || "Anonyme";
          alert("Merci " + name + " pour ton don !");
        });
      },

      onError: function() {
        showPaypalError("PayPal n'a pas pu ouvrir le paiement. Reessaie dans un nouvel onglet ou avec un autre navigateur.");
      }
    }).render("#paypal-button-container");
  </script>
</body>
</html>
