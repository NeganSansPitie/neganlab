<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080707"/><stop offset=".5" stop-color="#300d12"/><stop offset="1" stop-color="#080707"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#8d1d2a" stop-opacity=".6"/><stop offset="1" stop-color="#120609" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a0"/><stop offset=".45" stop-color="#d8b75d"/><stop offset="1" stop-color="#79561d"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="900" height="1400" fill="url(#bg)"/>
<ellipse cx="450" cy="590" rx="430" ry="430" fill="url(#light)"/>
